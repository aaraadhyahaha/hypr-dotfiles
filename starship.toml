add_newline = true
format = "$directory$git_branch$git_status$character"
right_format = "$cmd_duration"

[character]
success_symbol = "[❯](bold #86d6be)"
error_symbol = "[❯](bold #ffb4ab)"

[directory]
style = "bold #86d6be"
truncation_length = 3
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "#a9cbe3"
format = "[$symbol$branch]($style) "

[git_status]
style = "#b2ccc2"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "#89938e"
format = "[$duration]($style)"
