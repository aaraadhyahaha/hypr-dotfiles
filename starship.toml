add_newline = true
format = "$directory$git_branch$git_status$character"
right_format = "$cmd_duration"

[character]
success_symbol = "[❯](bold #bcc2ff)"
error_symbol = "[❯](bold #ffb4ab)"

[directory]
style = "bold #bcc2ff"
truncation_length = 3
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "#e6bad6"
format = "[$symbol$branch]($style) "

[git_status]
style = "#c4c5dd"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "#90909a"
format = "[$duration]($style)"
