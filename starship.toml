add_newline = true
format = "$directory$git_branch$git_status$character"
right_format = "$cmd_duration"

[character]
success_symbol = "[❯](bold #b3c5ff)"
error_symbol = "[❯](bold #ffb4ab)"

[directory]
style = "bold #b3c5ff"
truncation_length = 3
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "#e1bbdc"
format = "[$symbol$branch]($style) "

[git_status]
style = "#c1c6dd"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "#8f909a"
format = "[$duration]($style)"
