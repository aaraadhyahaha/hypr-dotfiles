# FreeType stem darkening (the macOS-style slight thickening of thin strokes), for
# CFF fonts and the autohinter that fontconfig/conf.d/10-autohint.conf forces.
# systemd --user reads this at login, so D-Bus-activated apps get it too.
# Chosen with ~/.config/hypr/scripts/fontbench (config E).
FREETYPE_PROPERTIES="cff:no-stem-darkening=0 autofitter:no-stem-darkening=0"
