# GTK 4.24 binds ext_background_effect_v1 with an empty blur region, which makes
# Hyprland 0.56 skip blur on that window. Hide the protocol from every GTK4 app.
# systemd --user reads this at login, so D-Bus/systemd-activated apps (Loupe,
# Nautilus, Papers, ...) get it too. Remove once Hyprland handles empty regions.
GDK_WAYLAND_DISABLE=ext_background_effect_manager_v1
