<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Crisp text at scale 1 (eDP-1, 143 PPI). SF Pro and most UI fonts ship without hinting
  instructions, so FreeType never snaps their horizontals to the pixel grid. Force the
  autohinter in light mode: x-height, baseline and bar strokes land on whole pixels,
  horizontal shapes are left alone. Chosen with ~/.config/hypr/scripts/fontbench (config E),
  paired with FREETYPE_PROPERTIES stem darkening (environment.d/60-font-render.conf).
-->
<fontconfig>
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
