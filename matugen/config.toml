[config]

# ANSI hues for kitty; blend = false keeps red red instead of pulling it toward the wallpaper.
[config.custom_colors]
red     = { color = "#e5484d", blend = false }
green   = { color = "#30a46c", blend = false }
yellow  = { color = "#e2a336", blend = false }
blue    = { color = "#0090ff", blend = false }
magenta = { color = "#8e4ec6", blend = false }
cyan    = { color = "#12a594", blend = false }

[templates.ags]
input_path = '~/.config/matugen/templates/ags-colors.scss'
output_path = '~/.config/ags/colors.scss'
post_hook = "fish -c agsr"

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'python3 ~/.config/kitty/blend-cursor.py; pkill -USR1 kitty'

[templates.fish]
input_path = '~/.config/matugen/templates/fish-colors.fish'
output_path = '~/.config/fish/matugen-colors.fish'
post_hook = "fish -c 'source ~/.config/fish/matugen-colors.fish'"

[templates.starship]
input_path = '~/.config/matugen/templates/starship.toml'
output_path = '~/.config/starship.toml'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock.conf'
output_path = '~/.config/hypr/hyprlock.conf'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qt-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'
