general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.2
    noise = 0.02
}

label {
    monitor =
    text = $TIME
    color = rgba(232, 232, 242, 1.0)
    font_size = 96
    font_family = SF Pro Text
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(232, 232, 242, 0.7)
    font_size = 18
    font_family = SF Pro Text
    position = 0, 85
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 0
    rounding = 10
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    inner_color = rgba(22, 22, 30, 0.55)
    font_color = rgba(232, 232, 242, 1.0)
    font_family = SF Pro Text
    check_color = rgba(169, 184, 255, 1.0)
    fail_color = rgba(255, 107, 129, 1.0)
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $FAIL
    position = 0, -40
    halign = center
    valign = center
}
