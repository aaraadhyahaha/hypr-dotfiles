# Font
font_family      SF Mono
font_size        12.5

# Window
window_padding_width 14
# Hyprland renders kitty at full opacity (rules.lua), so this alone sets the glass.
background_opacity   0.8
# SGR-dim text (Claude Code tool output, hints) stays legible over the blur
dim_opacity          0.6
confirm_os_window_close 0

# Cursor
cursor_shape         block 
cursor_trail         3
cursor_trail_decay   0.1 0.4
shell_integration    no-cursor

# Tabs (only shown when you have 2+)
tab_bar_min_tabs     2
tab_bar_style        fade

# Colors

include colors.conf
