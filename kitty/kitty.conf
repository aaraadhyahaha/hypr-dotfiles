# Font
font_family      SF Mono
font_size        12.5

# Window
window_padding_width 14
background_opacity   0.65
confirm_os_window_close 0

# Cursor
cursor_shape         block 
cursor_trail         3
cursor_trail_decay   0.1 0.4
shell_integration    no-cursor

# Tabs (only shown when you have 2+)
tab_bar_min_tabs     2
tab_bar_style        fade

# Colors
foreground           #e8e8f2
background           #16161e
selection_foreground #16161e
selection_background #a9b8ff
cursor               #a9b8ff
cursor_text_color    #16161e
url_color            #a9b8ff

